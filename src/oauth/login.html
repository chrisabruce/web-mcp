<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect to web-mcp</title>
  <style>
    :root { color-scheme: light dark; --accent: #c96442; }
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(26rem, 100% - 2rem); padding: 2rem; border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: 12px; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input { width: 100%; box-sizing: border-box; padding: .6rem; font: inherit; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
    button { margin-top: 1rem; width: 100%; padding: .7rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    .error { color: #d33; font-weight: 600; }
    .muted { opacity: .7; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to web-mcp</h1>
    <p><strong>{{client}}</strong> wants to use this server's web search and fetch tools.</p>
    <p class="muted">You'll be returned to <strong>{{redirect_host}}</strong>.</p>
    {{error}}
    <form method="post" action="/authorize">
      <input type="hidden" name="request" value="{{request}}">
      <label for="password">Access token</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Authorize</button>
    </form>
  </main>
</body>
</html>
