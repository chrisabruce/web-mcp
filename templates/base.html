<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}web-mcp{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --accent: #c96442; --line: color-mix(in srgb, currentColor 15%, transparent); }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 1.5rem; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 1.1rem; margin: 0; }
    main { width: min(60rem, 100% - 2rem); margin: 1.5rem auto 4rem; }
    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
    .muted { opacity: .7; font-size: .875rem; }
    table { width: 100%; border-collapse: collapse; margin: .75rem 0; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
    form.inline { display: inline; }
    fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    legend { font-weight: 600; padding: 0 .25rem; }
    label { display: block; font-weight: 600; font-size: .875rem; margin: .5rem 0 .2rem; }
    input, textarea { width: 100%; padding: .5rem; font: inherit; border-radius: 7px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
    textarea { min-height: 6rem; font-family: ui-monospace, monospace; font-size: .8rem; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0 1rem; }
    button { padding: .45rem .9rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 7px; cursor: pointer; margin-top: .75rem; }
    button.secondary { background: transparent; color: inherit; border: 1px solid var(--line); margin: 0; padding: .25rem .6rem; font-weight: 500; }
    button.danger { background: transparent; color: #d33; border: 1px solid #d33; margin: 0; padding: .25rem .6rem; font-weight: 500; }
    .notice { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; border: 1px solid var(--line); }
    .notice.ok { border-color: #2a7; }
    .notice.err { border-color: #d33; color: #d33; font-weight: 600; }
    .key { font-family: ui-monospace, monospace; font-size: .95rem; word-break: break-all; padding: .6rem; border-radius: 6px; border: 1px dashed var(--accent); user-select: all; }
    .tag { font-size: .75rem; padding: .05rem .4rem; border-radius: 4px; border: 1px solid var(--line); }
    code { font-family: ui-monospace, monospace; font-size: .85em; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
