[package]
name = "web-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server that lets Claude search and read the web through a SOCKS proxy"
license = "MIT"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
# Email address parsing for send_email (sending itself is JMAP over wreq).
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mime_guess = "2"
rand = "0.8"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# Must match the libsqlite3-sys version scrapling links, so stays on 0.33.
rusqlite = { version = "0.33", features = ["bundled"] }
schemars = "1"
scrapling = { git = "https://github.com/chrisabruce/scrapling-rs" }
scrapling-fetch = { git = "https://github.com/chrisabruce/scrapling-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# scrapling-fetch only compiles against these exact release candidates; newer RCs
# changed the emulation API. Pinned here so `cargo update` cannot break the build.
wreq = "=6.0.0-rc.28"
wreq-util = "=3.0.0-rc.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
